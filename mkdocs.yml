site_name: Marble Tree
site_url: https://vancem.github.io/MarbleTree/
site_description: >-
  How to laser-cut and assemble a wooden marble tree toy. Design files,
  material, cutter settings, and step-by-step assembly by Vance Morrison.
site_author: Vance Morrison
repo_url: https://github.com/vancem/MarbleTree
repo_name: vancem/MarbleTree
copyright: Copyright &copy; 2014-2026 <a href="https://vancem.github.io/VancePMorrison/">Vance Morrison</a>

# Keep local preview off MkDocs' default :8000 so CallerTips can use that port.
dev_addr: 127.0.0.1:8001

theme:
  name: material
  features:
    - navigation.footer
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - tables
  - toc:
      permalink: true

validation:
  anchors: warn

plugins:
  - search
  - print-site:
      add_to_navigation: true
      print_page_title: "Print / PDF (whole book)"
      add_print_site_banner: false
      add_cover_page: true
      enumerate_headings: true
      enumerate_headings_depth: 1

nav:
  - Introduction: index.md
  - "Laser-Cut Marble Tree": 01-laser-cut-marble-tree.md
  - "Laser Cutting Instructions": 02-laser-cutting-instructions.md
  - "Material Choice": 03-material-choice.md
  - "Cutting out the Pieces on the Laser Cutter": 04-cutting-out-the-pieces-on-the-laser-cutter.md
  - "Modifying the Laser Cutter Design File": 05-modifying-the-laser-cutter-design-file.md
  - "Actually Cutting the Design on a Laser Cutter": 06-actually-cutting-the-design-on-a-laser-cutter.md
  - "Laser Cutter Parameters": 07-laser-cutter-parameters.md
  - "Result of the Laser Cutting": 08-result-of-the-laser-cutting.md
  - "Assembling the spines pieces": 09-assembling-the-spines-pieces.md
  - "Assembling the 4 Spines into the Trunk Core": 10-assembling-the-4-spines-into-the-trunk-core.md
  - "Attaching the Top Shingles": 11-attaching-the-top-shingles.md
  - "Glue the Spines Together": 12-glue-the-spines-together.md
  - "Glue the Bottom Shingles to the Central Core": 13-glue-the-bottom-shingles-to-the-central-core.md
  - "Glue the Rest of the Shingles": 14-glue-the-rest-of-the-shingles.md
  - "Assembling the Bottom Tray": 15-assembling-the-bottom-tray.md
  - "Attach the Trunk to the Tray": 16-attach-the-trunk-to-the-tray.md
  - "Glue in the Leaves": 17-glue-in-the-leaves.md
  - "Congratulations You Are Done!": 18-congratulations-you-are-done.md
